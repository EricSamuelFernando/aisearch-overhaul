name: Deploying microservices frontend DEMO ENV using lambda in AWS

on:
  push:
    branches:
      - demo-deploy

    paths-ignore: ["terraform/**", "README.md", '.github/workflows/demo-deploy-terraform.yaml']

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: "075502422618.dkr.ecr.us-west-1.amazonaws.com"
  ECR_REPOSITORY: "snaphomz-frontend-demo-terraform"
  LAMBDA_FUNCTION_NAME: "snaphomz-frontend-demo-terraform"
  NODE_VERSION: "22.x"
  S3_BUCKET: "snaphomz-frontend-demo-terraform"
  CLOUDFRONT_DISTRIBUTION_ID: "E27MB2F0VHAUFH"

jobs:
  deploy-frontend-demo:
    name: Deploy NextJS DEMO ENV frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Package Installtion
        run: |
          yarn install --frozen-lockfile
          echo "Package installation completed"

      - name: Build nextjs app
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npx next telemetry disable
          yarn build --no-lint
          echo "NextJS app built successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "AWS ECR login successful"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # - name: Build Docker image
      #   run: |
      #     docker build -t ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest .
      #     echo "Docker image built successfully"

      # - name: Push Docker image
      #   run: |
      #     docker push ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest
      #     echo "Docker image push successfully"

      - name: Set image tag (commit SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image (tagged with commit id)
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} .
          docker tag  ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
                      ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "Docker image built successfully: ${{ env.IMAGE_TAG }}"

      - name: Push image
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      # - name: Update lambda image
      #   run: |
      #     aws lambda update-function-code \
      #     --function-name ${{env.LAMBDA_FUNCTION_NAME}}  \
      #     --image-uri ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}
      #     echo "Lambda image updated successfully"

      - name: Update Lambda function code with the new Docker image tag
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --image-uri ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          echo "Lambda image updated successfully"

      - name: Wait for Lambda update to finish
        run: |
          while true; do
            STATUS=$(aws lambda get-function --function-name ${{ env.LAMBDA_FUNCTION_NAME }} --query 'Configuration.LastUpdateStatus' --output text)
            if [[ "$STATUS" == "Successful" ]]; then
              echo "Lambda function update is complete."
              break
            else
              echo "Lambda function update is in progress, waiting..."
              sleep 30
            fi
          done

      - name: Publish new version for Lambda
        run: |
          LAMBDA_VERSION=$(aws lambda publish-version \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Version' \
            --output text)
          echo "Lambda function published with version: $LAMBDA_VERSION"

      - name: Update alias to point to new version
        run: |
          aws lambda update-alias \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --name prod \
            --function-version $LAMBDA_VERSION
          echo "Lambda alias updated to point to version: $LAMBDA_VERSION"


      - name: Upload static file to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync .next/static/ s3://${{ env.S3_BUCKET }}/_next/static/ \
            --delete
          echo "Static assets uploaded to s3 successfully"

      - name: Upload public folder to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync public/ s3://${{ env.S3_BUCKET }}/public/ \
            --delete
          echo "Public folder uploaded to s3 successfully"

      - name: Upload assets folder to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync public/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --delete
          echo "Assets folder uploaded to s3 successfully"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "CloudFront cache invalidated"
