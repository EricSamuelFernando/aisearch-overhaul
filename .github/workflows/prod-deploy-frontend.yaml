name: Deploying microservices frontend PROD ENV using lambda in AWS

on:
  push:
    branches:
      - main

    paths-ignore:
      - "terraform/**"
      - "prod-deploy-terraform.yaml"
      - "prod-deploy-frontned.yaml"
      - "README.md"
      - ".gitignore"
      - ".env.development"
      - ".env.production"
      - "docker-compose.yml"

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: "075502422618.dkr.ecr.us-west-1.amazonaws.com"
  ECR_REPOSITORY: "snaphomz-frontend-prod-terraform"
  LAMBDA_FUNCTION_NAME: "snaphomz-frontend-prod-terraform"
  NODE_VERSION: "22.x"
  S3_BUCKET: "snaphomz-frontend-prod-terraform"
  CLOUDFRONT_DISTRIBUTION_ID: "E27MB2F0VHAUFH"
  ENVIRONMENT: production
  PROVISIONED-CONCURRENT-EXECUTIONS: 1

jobs:
  deploy-frontend-prod:
    name: Deploy NextJS PROD ENV frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Cache Yarn dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Package Installtion
        run: |
          yarn install --frozen-lockfile
          echo "Package installation completed"

      - name: Build nextjs app
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npx next telemetry disable
          yarn build --no-lint
          echo "NextJS app built successfully"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "AWS ECR login successful"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest .
          echo "Docker image built successfully"

      - name: Push Docker image
        run: |
          docker push ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest
          echo "Docker image push successfully"

      - name: Update lambda image
        run: |
          aws lambda update-function-code \
          --function-name ${{env.LAMBDA_FUNCTION_NAME}}  \
          --image-uri ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest
          echo "Lambda image updated successfully"

      - name: Wait for Lambda update to finish
        run: |
           aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: Publish new version for Lambda
        run: |
          LAMBDA_VERSION=$(aws lambda publish-version \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Version' \
            --output text)
          echo "Lambda function published with version: $LAMBDA_VERSION"
          echo "LAMBDA_VERSION=$LAMBDA_VERSION" >> $GITHUB_ENV  # Save the version to GITHUB_ENV

      - name: Update Lambda Provisioned Concurrency and Alias with New Version
        run: |
          # Ensure that LAMBDA_VERSION is available
          if [ -z "$LAMBDA_VERSION" ]; then
            echo "Error: LAMBDA_VERSION is not set!"
            exit 1
          fi

          # Check if the alias exists
          ALIAS_EXISTS=$(aws lambda get-alias \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --name ${{ env.ENVIRONMENT }} \
            --query 'Name' --output text 2>/dev/null || echo "Alias not found")

          # If the alias exists, update it, otherwise create the alias
          if [[ "$ALIAS_EXISTS" == "${{ env.ENVIRONMENT }}" ]]; then
            echo "Alias '${{ env.ENVIRONMENT }}' exists. Updating alias to point to version $LAMBDA_VERSION..."
            aws lambda update-alias \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --name ${{ env.ENVIRONMENT }} \
              --function-version $LAMBDA_VERSION
            echo "Lambda alias '${{ env.ENVIRONMENT }}' updated to point to version: $LAMBDA_VERSION"
          else
            echo "Alias '${{ env.ENVIRONMENT }}' does not exist. Creating alias and pointing it to version $LAMBDA_VERSION..."
            aws lambda create-alias \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --name ${{ env.ENVIRONMENT }} \
              --function-version $LAMBDA_VERSION
            echo "Lambda alias '${{ env.ENVIRONMENT }}' created and pointing to version: $LAMBDA_VERSION"

            # Update or create provisioned concurrency for the alias
            echo "Creating or updating provisioned concurrency for alias '${{ env.ENVIRONMENT }}' and version $LAMBDA_VERSION..."
            aws lambda put-provisioned-concurrency-config \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --qualifier ${{ env.ENVIRONMENT }} \
              --provisioned-concurrent-executions ${{ env.PROVISIONED-CONCURRENT-EXECUTIONS }}
            echo "Provisioned concurrency created or updated for alias: ${{ env.ENVIRONMENT }}"
          fi

      - name: Upload static file to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync .next/static/ s3://${{ env.S3_BUCKET }}/_next/static/ \
            --delete
          echo "Static assets uploaded to s3 successfully"

      - name: Upload public folder to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync public/ s3://${{ env.S3_BUCKET }}/public/ \
            --delete
          echo "Public folder uploaded to s3 successfully"

      - name: Upload assets folder to s3
        run: |
          echo "Deploying static assets with long cache..."
          aws s3 sync public/assets/ s3://${{ env.S3_BUCKET }}/assets/ \
            --delete
          echo "Assets folder uploaded to s3 successfully"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "CloudFront cache invalidated done"
