name: Deploying Terraform Resources in AWS

on:
  pull_request:
    branches:
      - release
      - main
    paths: ['terraform/**', '.github/workflows/deploy-terraform.yaml']

env:
  AWS_REGION: us-west-1

jobs:
  deploy-terraform:
    name: Terraform Plan ${{ matrix.env }} ENV
    runs-on: ubuntu-latest
    # Point 2: single job with a matrix replaces two near-identical jobs
    # Point 3: matrix context is not available in job-level `if` — filtering is done
    # via a gate step at the top instead (matrix IS available inside steps).
    strategy:
      matrix:
        include:
          - env: demo
            branch: release
            tfvars: demo.tfvars
            state_key: snaphomz-frontend-terraform/demo/terraform.tfstate
          - env: prod
            branch: main
            tfvars: prod.tfvars
            state_key: snaphomz-frontend-terraform/prod/terraform.tfstate

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check environment match
        id: gate
        run: |
          if [[ "${{ github.base_ref }}" == "${{ matrix.branch }}" ]]; then
            echo "active=true" >> $GITHUB_OUTPUT
          else
            echo "active=false" >> $GITHUB_OUTPUT
            echo "Skipping: PR targets '${{ github.base_ref }}', this matrix entry targets '${{ matrix.branch }}'"
          fi

      - name: Checkout code
        if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        if: steps.gate.outputs.active == 'true'
        with:
          terraform_version: '1.13.5'

      - name: Configure AWS credentials
        if: steps.gate.outputs.active == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        if: steps.gate.outputs.active == 'true'
        run: terraform init -backend-config="key=${{ matrix.state_key }}"

      - name: Terraform Plan
        if: steps.gate.outputs.active == 'true'
        id: plan
        run: terraform plan -no-color -input=false -var-file="${{ matrix.tfvars }}"
        continue-on-error: true

      # Point 4: post the plan output directly on the PR so reviewers don't need
      # to dig into workflow logs. Uses an env var to safely handle multiline output.
      - name: Post Terraform Plan to PR
        if: steps.gate.outputs.active == 'true'
        uses: actions/github-script@v8
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const plan = process.env.PLAN_OUTPUT || '(no output)';
            const body = [
              `#### Terraform Plan — \`${{ matrix.env }}\` ENV`,
              '```hcl',
              plan,
              '```',
              `*Plan outcome: \`${{ steps.plan.outcome }}\`*`
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

            if ('${{ steps.plan.outcome }}' === 'failure') {
              core.setFailed('Terraform plan failed');
            }
