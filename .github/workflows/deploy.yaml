name: Deploying microservices using lambda in AWS

on:
  push:
    branches:
      - main
      - lambda-cicd

  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: '075502422618.dkr.ecr.us-east-1.amazonaws.com'
  ECR_REPOSITORY: 'snaphomz-nextjs-frontend-dev'
  LAMBDA_FUNCTION_NAME: 'snaphomz-nextjs-frontend-dev'
  NODE_VERSION: '22.x'
  S3_BUCKET: 'snaphomz-nextjs-frontend-dev'

jobs:
  deploy-frontend-static:
    name: Deploy NextJS static frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Package Installtion
        run: |
          yarn install --frozen-lockfile

      - name: Build nextjs app
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npx next telemetry disable
          yarn build --no-lint

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest .
          echo "Docker image built successfully"

      - name: Push Docker image
        run: |
          docker push ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest
          echo "Docker image push successfully"

      - name: Update lambda image
        run: |
          aws lambda update-function-code \
          --function-name ${{env.LAMBDA_FUNCTION_NAME}}  \
          --image-uri ${{env.ECR_REGISTRY}}/${{env.ECR_REPOSITORY}}:latest

      - name: Upload static file to s3
        run: |
          echo "📤 Deploying static assets with long cache..."
          aws s3 sync .next/static/ s3://${{ env.S3_BUCKET }}/_next/static/ \
            --delete

      - name: Upload public folder to s3
        run: |
          echo "📤 Deploying static assets with long cache..."
          aws s3 sync public/ s3://${{ env.S3_BUCKET }}/public/ \
            --delete
