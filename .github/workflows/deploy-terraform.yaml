name: Deploying Terraform Resources in AWS

on:
  pull_request:
    branches:
      - release
      - main
    paths: ['terraform/**', '.github/workflows/deploy-terraform.yaml']

env:
  AWS_REGION: us-west-1

jobs:
  # --- DEMO ENVIRONMENT (Release Branch) ---#
  deploy-terraform-demo:
    name: Deploy DEMO ENV Terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release' || github.base_ref == 'release'
    
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'

      - name: Cache Terraform modules
        uses: actions/cache@v5
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-demo-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-demo-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="key=snaphomz-frontend-terraform/demo/terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -var-file="demo.tfvars"

      # - name: Terraform Apply
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/release'
      #   run: terraform apply -auto-approve -input=false -var-file="demo.tfvars"

  # --- PROD ENVIRONMENT (Main Branch) ---#
  deploy-terraform-prod:
    name: Deploy PROD ENV Terraform
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'

      - name: Cache Terraform modules
        uses: actions/cache@v5
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-prod-${{ hashFiles('terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-prod-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="key=snaphomz-frontend-terraform/prod/terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -no-color -input=false -var-file="prod.tfvars"

      # - name: Terraform Apply
      #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: terraform apply -auto-approve -input=false -var-file="prod.tfvars"
