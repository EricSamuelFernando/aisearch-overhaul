name: Deploying microservices using lambda in AWS

on:
  push:
    branches:
      - main
      - lambda-cicd

  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: '075502422618.dkr.ecr.us-east-1.amazonaws.com'
  ECR_REPOSITORY: 'snaphomz-nextjs-frontend-dev'
  LAMBDA_FUNCTION_NAME: 'snaphomz-nextjs-frontend-dev'
  NODE_VERSION: '24.*'

jobs:
  deploy-frontend:
    name: Deploy NextJS frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Package Installtion
        run: |
          yarn install --frozen-lockfile

      - name: Build nextjs image
        run: |
          yarn build

      - name: Check files
        run: |
          ls

