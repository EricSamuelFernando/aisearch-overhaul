name: Deploying Snaphomz frontend PROD ENV

on:
  push:
    branches:
      - main

    paths-ignore:
      - ".github/workflows/demo-deploy-frontend.yaml"
      - ".github/workflows/deploy-terraform.yaml"
      - "*.md"
      - ".gitignore"
      - "*.env*"
      - "*.txt"
      - "docker-compose.yml"

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: "075502422618.dkr.ecr.us-west-1.amazonaws.com"
  ECR_REPOSITORY: "snaphomz-frontend-prod-terraform"
  LAMBDA_FUNCTION_NAME: "snaphomz-frontend-prod-terraform"
  NODE_VERSION: "24.x"
  S3_BUCKET: "snaphomz-frontend-prod-terraform"
  CLOUDFRONT_DISTRIBUTION_ID: "E27MB2F0VHAUFH"
  ENVIRONMENT: production
  PROVISIONED_CONCURRENT_EXECUTIONS: 1

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if terraform files changed
        id: filter
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q '^terraform/'; then
            echo "terraform=true" >> $GITHUB_OUTPUT
          else
            echo "terraform=false" >> $GITHUB_OUTPUT
          fi

  terraform:
    name: Terraform Apply PROD ENV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config="key=snaphomz-frontend-terraform/prod/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false -var-file="prod.tfvars"

  build:
    name: Build PROD ENV frontend
    runs-on: ubuntu-latest
    needs: [changes, terraform]
    if: |
      always() &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped') &&
      needs.changes.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: ${{env.NODE_VERSION}}

      - name: Cache Yarn dependencies
        id: yarn-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.yarn/cache
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Package Installtion
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile
          echo "Package installation completed"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch secrets from AWS Secrets Manager
        run: |
          aws secretsmanager get-secret-value \
            --secret-id ${{ secrets.PROD_SECRET_MANAGER_ARN }} \
            --query SecretString \
            --output text | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' > .env.production
          echo "Secrets fetched and written to .env.production"

      - name: Build nextjs app
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          yarn build --no-lint
          echo "NextJS app built successfully"

      - name: Log in to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
          echo "AWS ECR login successful"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --cache-from type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache \
            --cache-to type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max \
            -t "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" \
            -t "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest" \
            -f Dockerfile \
            --push \
            .

      - name: Upload static build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: next-static
          path: .next/static/
          retention-days: 1

      - name: Upload public folder artifacts
        uses: actions/upload-artifact@v7
        with:
          name: public-folder
          path: public/
          retention-days: 1

  deploy:
    name: Deploy PROD ENV frontend
    runs-on: ubuntu-latest
    needs: build
    if: always() && needs.build.result == 'success'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download static build artifacts
        uses: actions/download-artifact@v8
        with:
          name: next-static
          path: .next/static/

      - name: Download public folder artifacts
        uses: actions/download-artifact@v8
        with:
          name: public-folder
          path: public/

      - name: Deploy image to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ env.LAMBDA_FUNCTION_NAME }}" \
            --image-uri "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest"

      - name: Upload public subfolders to s3 (parallel)
        run: |
          aws s3 sync .next/static/ s3://${{ env.S3_BUCKET }}/_next/static/ --delete &
          aws s3 sync public/assets/ s3://${{ env.S3_BUCKET }}/assets/ --delete &
          aws s3 sync public/logos/  s3://${{ env.S3_BUCKET }}/logos/  --delete &
          aws s3 sync public/data/   s3://${{ env.S3_BUCKET }}/data/   --delete &
          wait
          echo "Public subfolders uploaded to s3 successfully"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidating CloudFront cache..."
          # Excludes /_next/static/* — those files are content-hashed and their URLs
          # change each build, so they never go stale and don't need invalidation.
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/_next/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "CloudFront cache invalidated"

      - name: Wait for Lambda update to finish
        run: |
           aws lambda wait function-updated --function-name "${{ env.LAMBDA_FUNCTION_NAME }}"

      - name: Publish new version for Lambda
        run: |
          LAMBDA_VERSION=$(aws lambda publish-version \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Version' \
            --output text)
          echo "Lambda function published with version: $LAMBDA_VERSION"
          echo "LAMBDA_VERSION=$LAMBDA_VERSION" >> $GITHUB_ENV  # Save the version to GITHUB_ENV

      - name: Update Lambda Provisioned Concurrency and Alias with New Version
        run: |
          # Ensure that LAMBDA_VERSION is available
          if [ -z "$LAMBDA_VERSION" ]; then
            echo "Error: LAMBDA_VERSION is not set!"
            exit 1
          fi

          # Check if the alias exists
          ALIAS_EXISTS=$(aws lambda get-alias \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --name ${{ env.ENVIRONMENT }} \
            --query 'Name' --output text 2>/dev/null || echo "Alias not found")

          # If the alias exists, update it, otherwise create the alias
          if [[ "$ALIAS_EXISTS" == "${{ env.ENVIRONMENT }}" ]]; then
            echo "Alias '${{ env.ENVIRONMENT }}' exists. Updating alias to point to version $LAMBDA_VERSION..."
            aws lambda update-alias \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --name ${{ env.ENVIRONMENT }} \
              --function-version $LAMBDA_VERSION
            echo "Lambda alias '${{ env.ENVIRONMENT }}' updated to point to version: $LAMBDA_VERSION"
          else
            echo "Alias '${{ env.ENVIRONMENT }}' does not exist. Creating alias and pointing it to version $LAMBDA_VERSION..."
            aws lambda create-alias \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --name ${{ env.ENVIRONMENT }} \
              --function-version $LAMBDA_VERSION
            echo "Lambda alias '${{ env.ENVIRONMENT }}' created and pointing to version: $LAMBDA_VERSION"

            # Update or create provisioned concurrency for the alias
            echo "Creating or updating provisioned concurrency for alias '${{ env.ENVIRONMENT }}' and version $LAMBDA_VERSION..."
            aws lambda put-provisioned-concurrency-config \
              --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
              --qualifier ${{ env.ENVIRONMENT }} \
              --provisioned-concurrent-executions ${{ env.PROVISIONED_CONCURRENT_EXECUTIONS }}
            echo "Provisioned concurrency created or updated for alias: ${{ env.ENVIRONMENT }}"
          fi
